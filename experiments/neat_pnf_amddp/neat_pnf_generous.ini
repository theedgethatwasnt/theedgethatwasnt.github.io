; Generous-run NEAT config for the Hetzner campaign (per-island).
; Differences vs the sanity ini (neat_pnf_2in_3out.ini), tuned for the tiny
; 2-in / <=8-hidden / 3-out net with the full wavelet activation bank.
; (MAX_HIDDEN raised 5->8 in phase1_harness.py — a node-COUNT budget the net wires
;  into any depth; bidirectional fitness gate MIN_DIR_RATIO=0.15 added there too,
;  to stop the one-directional collapse that sank 10/16 islands in round 1.)
; Original sanity comment follows:
;   pop_size 50 -> 400 ; activation_mutate 0.20 -> 0.25 (activations are the lever)
;   response loosened (0.10/0.0 -> 0.20/0.5) — response = wavelet scale/frequency
;   node_add 0.25 -> 0.20 (cap=5 ceilings it) ; elitism 3 -> 6 (pop=400)
;   compatibility_threshold 3.0 -> 2.5 (hold diversity on tiny genomes; monitor)
; Run as 16 islands = 4 seeds x 4 exponents {0.4,0.5,0.6,0.7}, ~400 gens + ~60-gen
; global early-stop, migration every 10-25 gens (orchestration layer, not here).
[NEAT]
fitness_criterion      = max
fitness_threshold      = 999999
no_fitness_termination  = False
pop_size               = 400
reset_on_extinction    = False

[CappedGenome]
activation_default      = tanh
activation_mutate_rate  = 0.25
activation_options      = tanh sin cos gauss ricker morlet dog sech sinc
aggregation_default     = sum
aggregation_mutate_rate = 0.0
aggregation_options     = sum
bias_init_mean          = 0.0
bias_init_stdev         = 1.0
bias_max_value          = 5.0
bias_min_value          = -5.0
bias_mutate_power       = 0.5
bias_mutate_rate        = 0.7
bias_replace_rate       = 0.1
compatibility_disjoint_coefficient = 1.0
compatibility_weight_coefficient   = 0.5
conn_add_prob           = 0.3
conn_delete_prob        = 0.1
enabled_default         = True
enabled_mutate_rate     = 0.05
feed_forward            = True
initial_connection      = full_direct
node_add_prob           = 0.20
node_delete_prob        = 0.05
num_hidden              = 0
num_inputs              = 2
num_outputs             = 3
response_init_mean      = 1.0
response_init_stdev     = 0.5
response_max_value      = 5.0
response_min_value      = -5.0
response_mutate_power   = 0.2
response_mutate_rate    = 0.2
response_replace_rate   = 0.1
weight_init_mean        = 0.0
weight_init_stdev       = 1.0
weight_max_value        = 5.0
weight_min_value        = -5.0
weight_mutate_power     = 0.5
weight_mutate_rate      = 0.8
weight_replace_rate     = 0.1

[DefaultSpeciesSet]
compatibility_threshold = 2.5

[DefaultStagnation]
species_fitness_func = max
max_stagnation       = 40
species_elitism      = 3

[DefaultReproduction]
elitism            = 6
survival_threshold = 0.2
