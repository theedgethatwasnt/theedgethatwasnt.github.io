  # ═══════════════════════════════════════════════════════════════════
  # FX-SIGNALS — rolling-window pips/min + CSI for 12 pairs (Session 067)
  # Warm-up: fetches last 290 M5 bars from OANDA on start.
  # Writes /data/logs/signals_state.json every 30s (read by dashboard).
  # ═══════════════════════════════════════════════════════════════════
  fx-signals:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile.strategy
    environment:
      - SIGNALS_STATE_DIR=/data/logs
      - LOG_LEVEL=INFO
    volumes:
      - fx-logs:/data/logs
      - ./lib:/app/lib:ro
    command: python3 services/fx_signals/main.py
    healthcheck:
      test: ["CMD", "python3", "-c", "import os; os.path.exists('/data/logs/signals_state.json') or exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3

  # ═══════════════════════════════════════════════════════════════════
  # TICK MOMENTUM — live tick-resolution momentum + spread from v20 stream
  #   5s rolling window, per-tick (~250ms). Writes tick_momentum_state.json
  #   for the dashboard /tick_mom tab. Captures raw bid/ask to /data/ticks
  #   (per-UTC-day JSONL) for replay.
  # ═══════════════════════════════════════════════════════════════════
  fx-tick-mom:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile.strategy
    environment:
      - TICK_STATE_DIR=/data/logs
      - TICK_CAPTURE_DIR=/data/ticks
      - TICK_CAPTURE=1
      # 28-pair major matrix drives the currency-strength ladder; cards = subset
      - TICK_PAIRS=EUR_USD,EUR_GBP,EUR_AUD,EUR_NZD,EUR_CAD,EUR_CHF,EUR_JPY,GBP_USD,GBP_AUD,GBP_NZD,GBP_CAD,GBP_CHF,GBP_JPY,AUD_USD,AUD_NZD,AUD_CAD,AUD_CHF,AUD_JPY,NZD_USD,NZD_CAD,NZD_CHF,NZD_JPY,USD_CAD,USD_CHF,USD_JPY,CAD_CHF,CAD_JPY,CHF_JPY
      - TICK_CARD_PAIRS=EUR_USD,USD_JPY,GBP_USD,AUD_USD
      - TICK_WINDOWS=5,30
      # capture retention — RAISED 2026-06-25 to build a tick-replay corpus for the on_tick reversion
      # rebuild (validation = replay recorded ticks + forward paper, no deep bar-history). ~6MB/h => 15GB
      # ~= 100 days; age-prune effectively off (1yr), size cap is the real bound, leaves ~26GB free disk.
      - TICK_CAPTURE_RETENTION_HOURS=8760
      - TICK_CAPTURE_MAX_MB=15000
      - LOG_LEVEL=INFO
    volumes:
      - fx-logs:/data/logs
      - fx-ticks:/data/ticks
      - ./lib:/app/lib:ro
    command: python3 services/fx_tick_mom/main.py
    healthcheck:
      test: ["CMD", "python3", "-c", "import os; os.path.exists('/data/logs/tick_momentum_state.json') or exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3

  # ═══════════════════════════════════════════════════════════════════
  # DASHBOARD — unified drill-down UI (internet-exposed via nginx)
  # ═══════════════════════════════════════════════════════════════════
  fx-dashboard:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile.strategy
    command: ["python3", "-m", "services.dashboard.main"]
    volumes:
      - fx-db:/data/db:rw
      - fx-zmq:/tmp/zmq
      - fx-logs:/data/logs:ro
      - ./lib:/app/lib:ro
      - ./research/portfolio:/app/portfolio:ro
      - ./services:/app/services:ro
    expose:
      - "5558"
    deploy:
      resources:
        limits:
          memory: 128M

  # ═══════════════════════════════════════════════════════════════════
  # TELEGRAM BOT — commands + kill switch via Docker API
  # ═══════════════════════════════════════════════════════════════════
  fx-telegram-bot:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile.strategy
    command: ["python3", "-m", "services.telegram_bot.main"]
    volumes:
      - fx-db:/data/db:rw
      - fx-logs:/data/logs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./lib:/app/lib:ro
      - ./services:/app/services:ro
    deploy:
      resources:
        limits:
          memory: 128M

  # ═══════════════════════════════════════════════════════════════════
  # NGINX — HTTPS reverse proxy for dashboard (internet access)
  # ═══════════════════════════════════════════════════════════════════
  fx-nginx:
    <<: *common
    image: nginx:alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - fx-dashboard
    deploy:
      resources:
        limits:
          memory: 64M

  # ═══════════════════════════════════════════════════════════════════
  # AUTORESEARCH — autonomous strategy discovery (sandboxed)
  # ═══════════════════════════════════════════════════════════════════
  fx-autoresearch:
    restart: "no"  # Disabled - burning API credits
    <<: *common
    profiles: ["off"]   # 2026-06-10: lockdown — never auto-start on compose up
    build:
      context: ../auto_research
      dockerfile: docker/Dockerfile.agent
    tmpfs:
      - /tmp:size=1G
    command: >
      bash -c 'cd /home/researcher/workspace;
      while true; do
        claude -p "Read program.md then run 10 experiments using prepare.py" --dangerously-skip-permissions 2>&1 | tee -a /tmp/autoresearch.log;
        sleep 30;
      done'
    volumes:
      - ../auto_research/karpathy:/home/researcher/workspace
      - ../auto_research:/home/researcher/auto_research:ro
      - ./lib:/home/researcher/fx-core/lib:ro
      - ./data/asi_mc_indicators:/data/indicators:ro
      - ./research/reports:/data/reports:ro
      - autoresearch_cache:/home/researcher/scalper/data/cache
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN_HERMES}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY_CLAUDE}
      - DISABLE_AUTOUPDATE=1
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "4"

  # ═══════════════════════════════════════════════════════════════════
  # HERMES AGENT — self-improving AI assistant (Telegram via c_bot)
  # Replaces OpenClaw: GEPA self-improving loop, auto skill creation
  # ═══════════════════════════════════════════════════════════════════
  fx-hermes:
    <<: *common
    profiles: ["off"]   # 2026-06-10: lockdown — never auto-start on compose up
    image: hermes-agent:local
    volumes:
      - ${HOME}/.hermes:/opt/data
      - ${HOME}/projects/auto_research/karpathy:/opt/data/workspace
      - ${HOME}/projects/fx-core/lib:/opt/data/fx-core-lib:ro
      - ${HOME}/projects/fx-core/data/asi_mc_indicators:/opt/data/indicators:ro
    command: ["gateway", "run"]
    deploy:
      resources:
