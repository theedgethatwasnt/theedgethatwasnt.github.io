version: "3.9"

x-common: &common
  restart: always
  env_file: .env
  networks: [fx-net]
  dns:
    - 8.8.8.8
    - 8.8.4.4
  # 2026-06-10: Docker embedded DNS forwarder at 127.0.0.11 returned SERVFAIL
  # for fx-core_fx-net containers after the daemon ran for ~10h. Fresh
  # containers on the same network resolved fine; existing ones could not.
  # Hardcoding OANDA's CloudFlare CDN IPs in /etc/hosts bypasses DNS entirely
  # for our hot path. CloudFlare IPs are stable for OANDA's edge — re-resolve
  # from host (`getent hosts api-fxtrade.oanda.com`) if they ever change.
  extra_hosts:
    - "api-fxtrade.oanda.com:172.64.153.184"
    - "stream-fxtrade.oanda.com:104.18.35.163"
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"

x-strategy: &strategy
  <<: *common
  build:
    context: .
    dockerfile: Dockerfile.strategy
  environment:
  volumes:
    - fx-db:/data/db
    - fx-zmq:/tmp/zmq
    - fx-logs:/data/logs
    - ./lib:/app/lib:ro
  depends_on:
    fx-data-curator:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python3", "-c", "import os; exit(0 if os.path.exists('/tmp/alive') else 1)"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 60s
  deploy:
    resources:
      limits:
        memory: 256M

x-neat: &neat
  <<: *strategy
  command: ["python3", "-m", "services.strategy_neat.main"]
  volumes:
    - fx-db:/data/db
    - fx-zmq:/tmp/zmq
    - fx-logs:/data/logs
    - ./lib:/app/lib:ro
    - ./models:/data/models:ro
  deploy:
    resources:
      limits:
        memory: 512M

volumes:
  fx-db:
  fx-zmq:
  fx-logs:
  fx-ticks:
  autoresearch_cache:
  openclaw_config:
  openclaw_workspace:

networks:
  fx-net:
    driver: bridge

services:

  # ═══════════════════════════════════════════════════════════════════
  # DATA CURATOR — single source of truth for all market data
  # ═══════════════════════════════════════════════════════════════════
  fx-data-curator:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile.curator
    volumes:
      - fx-db:/data/db
      - fx-zmq:/tmp/zmq
      - fx-logs:/data/logs
      - ./lib:/app/lib:ro
      - ./data:/data/parquet:ro
    healthcheck:
      test: ["CMD", "python3", "-c",
        "import zmq; c=zmq.Context(); s=c.socket(zmq.REQ); s.connect('ipc:///tmp/zmq/health.ipc'); s.setsockopt(zmq.RCVTIMEO,5000); s.send(b'ping'); r=s.recv(); exit(0 if r==b'pong' else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

  # ═══════════════════════════════════════════════════════════════════
  # PORTFOLIO MANAGER — centralized allocation + account monitoring
  # ═══════════════════════════════════════════════════════════════════
  fx-portfolio-mgr:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile.strategy
    command: ["python3", "-m", "services.portfolio_mgr.main"]
    volumes:
      - fx-db:/data/db
      - fx-zmq:/tmp/zmq
      - fx-logs:/data/logs
      - ./lib:/app/lib:ro
    depends_on:
      fx-data-curator:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  # ═══════════════════════════════════════════════════════════════════
  # TRADITIONAL STRATEGIES (1 container each, multi-pair)
  # ═══════════════════════════════════════════════════════════════════
  fx-strategy-impulse:
    <<: *strategy
    profiles: ["off"]   # 2026-06-10: lockdown — never auto-start on compose up
    command: ["python3", "-m", "services.strategy_impulse.main"]
    environment:
      - OANDA_ACCOUNT=001-001-${OANDA_CUSTOMER_ID}-001
      - STRATEGY_NAME=impulse

  # IronNet S5-FT per-pair on account 001 (replaces inactive Impulse)
  # EUR_GBP: +3,484p S5 OOS dir=0.49 | CAD_JPY: +13,811p S5 OOS dir=0.49
  # MC sign_p=0.0000 both pairs. Fixed topology, gauss activation.
  fx-ironnet-s5ft-001:
    <<: *neat
    profiles: ["off"]   # 2026-06-10: lockdown — never auto-start on compose up
    environment:
      - OANDA_ACCOUNT=001-001-${OANDA_CUSTOMER_ID}-001
      - STRATEGY_NAME=ironnet_s5ft_001
      - NEAT_GENOME=asi_mc_v3_best.pkl
      - NEAT_GENOME_MAP=EUR_GBP:iron_s5ft_EUR_GBP.pkl,CAD_JPY:iron_s5ft_CAD_JPY.pkl
      - NEAT_INPUT_MODE=asi_mc_v3
      - NEAT_BOX_SIZE=5
      - NEAT_REVERSAL=3
      - NEAT_EMERGENCY_SL=20
      - NEAT_EMERGENCY_TP=75
      - NEAT_MAX_HOLD_HOURS=7
      - NEAT_PAIRS=EUR_GBP,CAD_JPY
      - FX_VALIDATION_UNITS=1

  fx-strategy-strength:
    <<: *strategy
    profiles: ["off"]   # 2026-06-10: lockdown — never auto-start on compose up
    command: ["python3", "-m", "services.strategy_strength.main"]
    environment:
      - OANDA_ACCOUNT=001-001-${OANDA_CUSTOMER_ID}-002
      - STRATEGY_NAME=strength

  fx-strategy-fade:
    <<: *strategy
    profiles: ["off"]   # 2026-06-10: lockdown — never auto-start on compose up
    command: ["python3", "-m", "services.strategy_fade.main"]
    environment:
      - OANDA_ACCOUNT=001-001-${OANDA_CUSTOMER_ID}-003
      - STRATEGY_NAME=session_fade

  # ─── A/B TEST: ER-ranging gate vs raw (accounts 002/003) ────────────────────
  # Control: 001 (IronNet S5-FT raw), 009 (IronNet V3 raw)
  # Filtered: 002 (IronNet S5-FT + ER gate), 003 (IronNet V3 + ER gate)
  # ER_GATE_THRESHOLD=0.35: only enter when er_norm ≤ 0.35 (ranging market)
  # Filter study result: ER ranging = best single gate (+ve delta on all 5 genomes)

  fx-ironnet-v3-h1-002:
    <<: *neat
    profiles: ["off"]   # 2026-06-10: lockdown — never auto-start on compose up
    environment:
      - OANDA_ACCOUNT=001-001-${OANDA_CUSTOMER_ID}-002
      - STRATEGY_NAME=ironnet_v3_h1_002
      - NEAT_GENOME=asi_mc_v3_best.pkl
      - NEAT_GENOME_MAP=EUR_JPY:iron_v3_H1_EUR_JPY_s42_best.pkl,USD_JPY:iron_v3_H1_USD_JPY_s42_best.pkl,GBP_JPY:iron_v3_H1_GBP_JPY_s42_best.pkl,AUD_JPY:iron_v3_H1_AUD_JPY_s42_best.pkl,CAD_JPY:iron_v3_H1_CAD_JPY_s42_best.pkl,CHF_JPY:iron_v3_H1_CHF_JPY_s42_best.pkl,NZD_JPY:iron_v3_H1_NZD_JPY_s42_best.pkl,EUR_USD:iron_v3_H1_EUR_USD_s42_best.pkl,GBP_USD:iron_v3_H1_GBP_USD_s42_best.pkl,AUD_USD:iron_v3_H1_AUD_USD_s42_best.pkl,NZD_USD:iron_v3_H1_NZD_USD_s42_best.pkl,EUR_GBP:iron_v3_H1_EUR_GBP_s42_best.pkl
      - NEAT_INPUT_MODE=asi_mc_v3_h1
      - NEAT_BOX_SIZE=5
      - NEAT_REVERSAL=3
      - NEAT_EMERGENCY_SL=20
      - NEAT_EMERGENCY_TP=75
      - NEAT_MAX_HOLD_HOURS=17
      - FX_VALIDATION_UNITS=1

  fx-ironnet-v7-h1-003:
    <<: *neat
    profiles: ["off"]   # 2026-06-10: lockdown — never auto-start on compose up
    environment:
      - OANDA_ACCOUNT=001-001-${OANDA_CUSTOMER_ID}-003
      - STRATEGY_NAME=ironnet_v7_h1_003
      - NEAT_GENOME=asi_mc_v3_best.pkl
      - NEAT_GENOME_MAP=EUR_JPY:iron_v7_H1_EUR_JPY_s42_best.pkl,USD_JPY:iron_v7_H1_USD_JPY_s42_best.pkl,GBP_JPY:iron_v7_H1_GBP_JPY_s42_best.pkl,AUD_JPY:iron_v7_H1_AUD_JPY_s42_best.pkl,CAD_JPY:iron_v7_H1_CAD_JPY_s42_best.pkl,CHF_JPY:iron_v7_H1_CHF_JPY_s42_best.pkl,NZD_JPY:iron_v7_H1_NZD_JPY_s42_best.pkl,EUR_USD:iron_v7_H1_EUR_USD_s42_best.pkl,GBP_USD:iron_v7_H1_GBP_USD_s42_best.pkl,AUD_USD:iron_v7_H1_AUD_USD_s42_best.pkl,NZD_USD:iron_v7_H1_NZD_USD_s42_best.pkl,EUR_GBP:iron_v7_H1_EUR_GBP_s42_best.pkl
      - NEAT_INPUT_MODE=asi_mc_v7_h1
      - NEAT_BOX_SIZE=5
      - NEAT_REVERSAL=3
      - NEAT_EMERGENCY_SL=20
      - NEAT_EMERGENCY_TP=75
      - NEAT_MAX_HOLD_HOURS=17
      - FX_VALIDATION_UNITS=1

  # ═══════════════════════════════════════════════════════════════════
  # NEAT STRATEGIES (1 container per account, 12 pairs each)
  # ═══════════════════════════════════════════════════════════════════
  # Ensemble Gate SHORT (S3): 7 frozen experts + evolved gate. Sharpe 0.40, +53,500p OOS.
  fx-ensemble-short:
    <<: *neat
    profiles: ["off"]   # 2026-06-10: lockdown — never auto-start on compose up
    command: ["python3", "-m", "services.strategy_ensemble.main"]
    environment:
      - OANDA_ACCOUNT=001-001-${OANDA_CUSTOMER_ID}-004
      - STRATEGY_NAME=ensemble_short
      - ENSEMBLE_GENOME=ensemble_gate_short.pkl
      - ENSEMBLE_DIRECTION=short
      - FX_VALIDATION_UNITS=1

  # Ensemble Gate LONG (S4): 7 frozen experts + evolved gate. Sharpe 0.32, +55,439p OOS.
  fx-ensemble-long:
    <<: *neat
    profiles: ["off"]   # 2026-06-10: lockdown — never auto-start on compose up
    command: ["python3", "-m", "services.strategy_ensemble.main"]
    environment:
      - OANDA_ACCOUNT=001-001-${OANDA_CUSTOMER_ID}-005
      - STRATEGY_NAME=ensemble_long
      - ENSEMBLE_GENOME=ensemble_gate_long.pkl
      - ENSEMBLE_DIRECTION=long
      - FX_VALIDATION_UNITS=1

  fx-neat-str-r3s:
    <<: *neat
    profiles: ["off"]   # 2026-06-10: lockdown — never auto-start on compose up
    environment:
      - OANDA_ACCOUNT=001-001-${OANDA_CUSTOMER_ID}-006
      - STRATEGY_NAME=strength_rev3_short
      - NEAT_GENOME=strength_15pip_rev3_short.pkl
      - NEAT_INPUT_MODE=strength
      - NEAT_BOX_SIZE=15
      - NEAT_REVERSAL=3
      - NEAT_DIRECTION=short
      - NEAT_EMERGENCY_SL=20
      - NEAT_EMERGENCY_TP=75
      - NEAT_MAX_HOLD_HOURS=7
      - NEAT_PAIRS=GBP_USD,NZD_JPY
      - FX_VALIDATION_UNITS=1

  # ASI-MC v1 (007) — REMOVED: replaced by fx-range-neat-007 (range bar variant)
  # Old service was causing account conflict with fx-range-neat-007 on same account.

  # ASI-MC v2: SMA5(ASI(M5)) → MC(D)/MC(dD). Validated WF+MC 12/12. BIDIRECTIONAL.
  fx-asi-mc-008:
    <<: *neat
    profiles: ["off"]   # 2026-06-10: lockdown — never auto-start on compose up
    environment:
      - OANDA_ACCOUNT=001-001-${OANDA_CUSTOMER_ID}-008
      - STRATEGY_NAME=asi_mc_008
      - NEAT_GENOME=asi_mc_v2_best.pkl
      - NEAT_INPUT_MODE=asi_mc
      - NEAT_BOX_SIZE=5
      - NEAT_REVERSAL=3
      - NEAT_EMERGENCY_SL=20
      - NEAT_EMERGENCY_TP=75
      - NEAT_MAX_HOLD_HOURS=7
      - FX_VALIDATION_UNITS=1

  # IronNet V3 per-pair: Fixed-topology (4→4→3), 3-phase trained (2026-04-03/05)
  # Per-pair genomes — all MC validated sign_p=0.0000, avg OOS 42.0p/day across 10 pairs
  # A/B vs 003 (same genomes + ER_GATE_THRESHOLD=0.35)
  # NZD_JPY + NZD_USD genomes TBD — fallback to global asi_mc_v3_best.pkl meanwhile
  fx-ironnet-s1-h1-009:
    <<: *neat
    profiles: ["off"]   # 2026-06-10: lockdown — never auto-start on compose up
    environment:
      - OANDA_ACCOUNT=${OANDA_ACCOUNT_ID_009}
      - STRATEGY_NAME=ironnet_s1_h1_009
      - NEAT_GENOME=asi_mc_v3_best.pkl
      - NEAT_GENOME_MAP=EUR_JPY:iron_s1_H1_EUR_JPY_s42_best.pkl,USD_JPY:iron_s1_H1_USD_JPY_s42_best.pkl,GBP_JPY:iron_s1_H1_GBP_JPY_s42_best.pkl,AUD_JPY:iron_s1_H1_AUD_JPY_s42_best.pkl,CAD_JPY:iron_s1_H1_CAD_JPY_s42_best.pkl,CHF_JPY:iron_s1_H1_CHF_JPY_s42_best.pkl,NZD_JPY:iron_s1_H1_NZD_JPY_s42_best.pkl,EUR_USD:iron_s1_H1_EUR_USD_s42_best.pkl,GBP_USD:iron_s1_H1_GBP_USD_s42_best.pkl,AUD_USD:iron_s1_H1_AUD_USD_s42_best.pkl,NZD_USD:iron_s1_H1_NZD_USD_s42_best.pkl,EUR_GBP:iron_s1_H1_EUR_GBP_s42_best.pkl
      - NEAT_INPUT_MODE=s1_h1
      - NEAT_BOX_SIZE=5
      - NEAT_REVERSAL=3
      - NEAT_EMERGENCY_SL=20
      - NEAT_EMERGENCY_TP=75
      - NEAT_MAX_HOLD_HOURS=17
      - FX_VALIDATION_UNITS=1

  fx-neat-str-long:
    <<: *neat
    profiles: ["off"]   # 2026-06-10: lockdown — never auto-start on compose up
    environment:
      - OANDA_ACCOUNT=001-001-${OANDA_CUSTOMER_ID}-009
      - STRATEGY_NAME=strength_long
      - NEAT_GENOME=strength_15pip_rev2_long.pkl
      - NEAT_INPUT_MODE=strength
      - NEAT_BOX_SIZE=15
      - NEAT_REVERSAL=2
      - NEAT_DIRECTION=long
      - NEAT_EMERGENCY_SL=20
      - NEAT_EMERGENCY_TP=75
      - NEAT_MAX_HOLD_HOURS=7
      - NEAT_PAIRS=EUR_JPY,USD_JPY,GBP_JPY,AUD_JPY,CAD_JPY,CHF_JPY,NZD_JPY

  fx-neat-str-rev3:
    <<: *neat
    profiles: ["off"]   # 2026-06-10: lockdown — never auto-start on compose up
    environment:
      - OANDA_ACCOUNT=001-001-${OANDA_CUSTOMER_ID}-010
      - STRATEGY_NAME=strength_rev3
      - NEAT_GENOME=strength_15pip_rev3_long.pkl
      - NEAT_INPUT_MODE=strength
      - NEAT_BOX_SIZE=15
      - NEAT_REVERSAL=3
      - NEAT_DIRECTION=long
      - NEAT_EMERGENCY_SL=20
      - NEAT_EMERGENCY_TP=75
      - NEAT_MAX_HOLD_HOURS=7
      - NEAT_PAIRS=EUR_JPY,USD_JPY,GBP_JPY,AUD_JPY,CAD_JPY,CHF_JPY,NZD_JPY

  # ═══════════════════════════════════════════════════════════════════
  # TEST ACCOUNTS (011-013) — validated strategies under live testing
  # ═══════════════════════════════════════════════════════════════════
  fx-perpair-011:
    <<: *neat
    profiles: ["off"]   # 2026-06-10: lockdown — never auto-start on compose up
    environment:
      - OANDA_ACCOUNT=${OANDA_ACCOUNT_ID_011}
      - STRATEGY_NAME=perpair_a
      - NEAT_GENOME=asi_mc_v2_best.pkl
      - NEAT_GENOME_MAP=EUR_JPY:asi_mc_perpair_EUR_JPY.pkl,USD_JPY:asi_mc_perpair_USD_JPY.pkl,GBP_JPY:asi_mc_perpair_GBP_JPY.pkl,AUD_JPY:asi_mc_perpair_AUD_JPY.pkl,CAD_JPY:asi_mc_perpair_CAD_JPY.pkl,CHF_JPY:asi_mc_perpair_CHF_JPY.pkl,NZD_JPY:asi_mc_perpair_NZD_JPY.pkl,EUR_USD:asi_mc_perpair_EUR_USD.pkl,GBP_USD:asi_mc_perpair_GBP_USD.pkl,AUD_USD:asi_mc_perpair_AUD_USD.pkl,NZD_USD:asi_mc_perpair_NZD_USD.pkl,EUR_GBP:asi_mc_perpair_EUR_GBP.pkl
      - NEAT_INPUT_MODE=asi_mc
      - NEAT_BOX_SIZE=5
      - NEAT_REVERSAL=3
      - NEAT_DIRECTION=long
      - NEAT_EMERGENCY_SL=20
      - NEAT_EMERGENCY_TP=75
      - NEAT_MAX_HOLD_HOURS=7
      - FX_VALIDATION_UNITS=1

  fx-pnlmae-012:
    <<: *neat
    profiles: ["off"]   # 2026-06-10: lockdown — never auto-start on compose up
    environment:
      - OANDA_ACCOUNT=${OANDA_ACCOUNT_ID_012}
      - STRATEGY_NAME=pnl_mae_a
      - NEAT_GENOME=asi_mc_pnl_mae_best.pkl
      - NEAT_INPUT_MODE=asi_mc
      - NEAT_BOX_SIZE=5
      - NEAT_REVERSAL=3
      - NEAT_DIRECTION=long
      - NEAT_EMERGENCY_SL=20
      - NEAT_EMERGENCY_TP=75
      - NEAT_MAX_HOLD_HOURS=7
      - FX_VALIDATION_UNITS=1

  # fx-wfpnlmae-013 DISABLED — genome trained with lookahead bias (RCA 2026-04-12)

  # ═══════════════════════════════════════════════════════════════════
  # SB_A IRONNET — 12 pairs, account 013, range-10 bars
  #   First causal strategy post-RCA: 5/5 gates all pairs, perm_p=0.0000
  #   Swing signal (TopsBots on range bars) + IronNet 5→5→2 fixed-topology
  #   Per-trade Sharpe 87–120, OOS 378–450 p/d, fixed 1-lot per trade
  # ═══════════════════════════════════════════════════════════════════
  fx-sba-ironnet-013:
    profiles: ["off"]   # 2026-06-10: lockdown — never auto-start on compose up
    build:
      context: .
      dockerfile: services/strategy_sba_ironnet/Dockerfile
    restart: unless-stopped
    environment:
      - OANDA_ACCOUNT=${OANDA_ACCOUNT_ID_013}
      - OANDA_API_KEY=${OANDA_API_KEY}
      - OANDA_ENV=${OANDA_ENV:-live}
      - BASE_UNITS=20
      - STATE_FILE=/data/logs/sba_ironnet_013_state.json
      - LOG_LEVEL=INFO
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      - fx-logs:/data/logs
      - fx-zmq:/tmp/zmq
      - ./lib:/app/lib:ro
      - ./research/experiments/sb_a_ironnet/results:/app/research/experiments/sb_a_ironnet/results:ro
    command: python3 services/strategy_sba_ironnet/main.py
    depends_on:
      - fx-data-curator
    healthcheck:
      test: ["CMD", "python3", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3

  # ═══════════════════════════════════════════════════════════════════
  # ZONE RECOVERY — split-account ping-pong, EUR_USD M5
  #   011 = LONG legs, 012 = SHORT legs
  # ═══════════════════════════════════════════════════════════════════
  fx-zone-recovery:
    <<: *common
    profiles: ["off"]   # 2026-06-10: lockdown — never auto-start on compose up
    build:
      context: .
      dockerfile: Dockerfile.strategy
    environment:
      - OANDA_ACCOUNT_LONG=${OANDA_ACCOUNT_ID_011}
      - OANDA_ACCOUNT_SHORT=${OANDA_ACCOUNT_ID_012}
      - BASE_UNITS=20
      - STATE_FILE=/data/logs/zone_recovery_state.json
      - LOG_LEVEL=INFO
    volumes:
      - fx-logs:/data/logs
      - ./lib:/app/lib:ro
    command: python3 services/strategy_zone_recovery/main.py
    healthcheck:
      test: ["CMD", "python3", "-c", "import os; os.path.exists('/data/logs/zone_recovery_state.json') or exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3

  fx-zr-random:
    <<: *common
    profiles: ["off"]   # 2026-06-10: lockdown — never auto-start on compose up
    build:
      context: .
      dockerfile: Dockerfile.strategy
    environment:
      - OANDA_ACCOUNT_LONG=${OANDA_ACCOUNT_ID_011}
      - OANDA_ACCOUNT_SHORT=${OANDA_ACCOUNT_ID_012}
      - ZR_PAIRS=GBP_USD          # 2026-05-10: EUR_USD → GBP_USD absorption (body=0.5 PF=1.10, 3044 p/d IS=3/3 OOS=3/3 P5=929 CumL5=161 ta=6 B=2)
      - ZR_STATE_DIR=/data/logs
      - LOG_LEVEL=INFO
    volumes:
      - fx-db:/data/db:rw
      - fx-zmq:/tmp/zmq
      - fx-logs:/data/logs
      - ./lib:/app/lib:ro
    command: python3 services/strategy_zr_random/main.py
    healthcheck:
      test: ["CMD", "python3", "-c", "import os; os.path.exists('/data/logs/zr_random_GBP_USD_state.json') or exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3

  # ═══════════════════════════════════════════════════════════════════
  # ZR PAPER TRADER — all 6 validated ZR strategies on live OANDA data
  # No real orders — simulated fills at bar close / stop price.
  # Status: /data/logs/zr_paper_status.json | Trades: zr_paper_trades.jsonl
  # ═══════════════════════════════════════════════════════════════════
  fx-zr-paper:
    <<: *common
    profiles: ["off"]   # 2026-06-11: STOPPED by user — martingale fat tail, off paper
    build:
      context: .
      dockerfile: Dockerfile.strategy
    environment:
      - OANDA_ACCOUNT_LONG=${OANDA_ACCOUNT_ID_011}
      - OANDA_ACCOUNT_SHORT=${OANDA_ACCOUNT_ID_012}
      - ZR_STATE_DIR=/data/logs
      - LOG_LEVEL=INFO
    volumes:
      - fx-db:/data/db:rw
      - fx-logs:/data/logs
      - ./lib:/app/lib:ro
    command: python3 services/strategy_zr_paper/main.py
    healthcheck:
      test: ["CMD", "python3", "-c", "import os; os.path.exists('/data/logs/zr_paper_status.json') or exit(0)"]
      interval: 60s
      timeout: 10s
